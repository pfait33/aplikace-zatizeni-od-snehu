services:
  - type: web
    name: aplikace-zatizeni-od-snehu-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CORS_ORIGINS
        value: https://pfait33.github.io,http://localhost:5173
      - key: CADASTRAL_ONLINE_ENABLED
        value: "true"
      - key: SNOW_LOAD_ONLINE_ENABLED
        value: "true"
      - key: ELEVATION_ONLINE_ENABLED
        value: "true"
